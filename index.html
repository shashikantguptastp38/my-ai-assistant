<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f0f14;
  color: white;
  height: 100vh;
}

.app {
  max-width: 600px;
  height: 100vh;
  margin: auto;
  display: flex;
  flex-direction: column;
}

header {
  padding: 20px;
  font-size: 24px;
  font-weight: bold;
  border-bottom: 1px solid #292933;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.message {
  padding: 12px 15px;
  margin: 10px 0;
  border-radius: 15px;
  max-width: 85%;
}

.user {
  background: #3b82f6;
  margin-left: auto;
}

.ai {
  background: #252530;
  margin-right: auto;
}

.input-area {
  display: flex;
  gap: 10px;
  padding: 15px;
  border-top: 1px solid #292933;
}

input {
  flex: 1;
  padding: 14px;
  border-radius: 12px;
  border: none;
  outline: none;
  background: #252530;
  color: white;
}

button {
  border: none;
  border-radius: 12px;
  padding: 0 20px;
  background: #3b82f6;
  color: white;
  font-size: 16px;
}
</style>
</head>

<body>

<div class="app">

<header>
🤖 My AI
</header>

<div id="chat">

<div class="message ai">
Hello! 👋 Main My AI hoon.
Aap mujhe kuch bhi pooch sakte ho.
</div>

</div>

<div class="input-area">

<input
id="messageInput"
type="text"
placeholder="Message My AI..."
>

<button onclick="sendMessage()">
Send
</button>

</div>

</div>

<script>

function sendMessage() {

const input = document.getElementById("messageInput");
const chat = document.getElementById("chat");

const message = input.value.trim();

if (!message) return;

const userMessage = document.createElement("div");

userMessage.className = "message user";

userMessage.textContent = message;

chat.appendChild(userMessage);

input.value = "";

const aiMessage = document.createElement("div");

aiMessage.className = "message ai";

aiMessage.textContent =
"Main abhi learning mode mein hoon 🤖. Agle step mein mujhe real AI se connect karenge.";

chat.appendChild(aiMessage);

chat.scrollTop = chat.scrollHeight;

}

</script>

</body>
</html>
