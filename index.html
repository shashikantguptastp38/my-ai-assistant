
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My AI Assistant</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101018;color:white;font-family:Arial}
.app{max-width:600px;margin:auto;height:100dvh;display:flex;flex-direction:column}
header{padding:20px;font-size:23px;font-weight:bold;border-bottom:1px solid #333}
#chat{flex:1;overflow-y:auto;padding:16px}
.message{padding:13px;margin:10px 0;border-radius:14px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}
.user{background:#2563eb;margin-left:auto}
.ai{background:#292936}
.input{display:flex;gap:8px;padding:12px;border-top:1px solid #333}
input{flex:1;min-width:0;padding:14px;border:0;border-radius:12px;background:#292936;color:white}
button{border:0;border-radius:12px;padding:12px 18px;background:#3978ff;color:white}
</style>
</head>
<body>
<div class="app">
<header>🤖 My AI</header>
<div id="chat">
<div class="message ai">Hello! 👋 Main My AI hoon. Mujhse kuch bhi poochho!</div>
</div>
<div class="input">
<input id="msg" placeholder="Ask anything...">
<button id="send">Send</button>
</div>
</div>
<script>
const API_URL = "https://my-ai-backend.shashikantguptastp38.workers.dev/";

const chat = document.getElementById("chat");
const input = document.getElementById("msg");
const button = document.getElementById("send");

function addMessage(text,type){
  const div=document.createElement("div");
  div.className="message "+type;
  div.textContent=text;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}

async function sendMessage(){
  const message=input.value.trim();
  if(!message || button.disabled)return;

  addMessage(message,"user");
  input.value="";
  button.disabled=true;
  button.textContent="...";

  try{
    const response=await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message})
    });

    const data=await response.json();

    if(!response.ok) throw new Error(data.error || "Request failed");

    addMessage(data.reply || "No response received.","ai");
  }catch(error){
    addMessage("Error: "+error.message,"ai");
  }finally{
    button.disabled=false;
    button.textContent="Send";
  }
}

button.addEventListener("click",sendMessage);
input.addEventListener("keydown",e=>{
  if(e.key==="Enter")sendMessage();
});
</script>
</body>
</html>
